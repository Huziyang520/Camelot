# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# 版本号全线共用：同一分支内所有 target 一起改号。
# Project
version=1.0.0
group=com.camelot
java_version=25

# Common
minecraft_version=26.3
mc_range_label=26.3
mod_name=Camelot
mod_author=Huziyang520
mod_id=camelot
license=MIT
credits=
# 注意：模组列表里的简介已写死在元数据模板（neoforge.mods.toml / fabric.mod.json）里做中英双语，改这一行不再生效
description=[EN] Shared library for Only TP and AuthCmd: config UI plumbing, notices, networking and GUI helpers. [CN] Only TP 与 AuthCmd 的共享前置库：配置界面接线、提示、网络与界面辅助。
minecraft_version_range=[26.3, 26.4)
# NeoForm version used to remap the 'common' module for 26.3
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.160.5+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
# 26.3 起 neoforge.mods.toml 不再写 modLoader / loaderVersion，neoforge_loader_version_range 属性同步移除
neoforge_version=26.3.0.1-beta

# 本 target 的可选源码覆盖目录（相对 targets/<t>/），空 = 不覆盖。
target_overlay=

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.java.installations.fromEnv=JAVA_HOME
